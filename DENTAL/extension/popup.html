<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Cotizador Dental Bci</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app" id="app">

  <div class="izq">
    <div class="uf">
      <span class="uf-t">UF</span>
      <span class="uf-v" id="ufVal">—</span>
      <span class="uf-f" id="ufFecha"></span>
      <button id="ufReload" type="button" title="Actualizar UF">&#8635;</button>
    </div>
    <div class="uf-manual" id="ufManualBox">
      <label for="ufManual">Sin conexión. Valor UF:</label>
      <input id="ufManual" type="text" inputmode="decimal" placeholder="39454,17">
    </div>

    <div class="campo">
      <label>Cargas (adicionales del titular)</label>
      <div class="conteo" id="conteo">
        <button type="button" data-n="0" class="on">0</button>
        <button type="button" data-n="1">1</button>
        <button type="button" data-n="2">2</button>
        <button type="button" data-n="3">3</button>
      </div>
    </div>

    <div class="verif">
      <button type="button" id="abrirVerif" class="abrir">
        <span>&#9656;</span> Edad de las cargas
      </button>
      <div id="panelVerif" hidden>
        <p class="pista">Pregunta la edad y escríbela. Si durante la llamada consigues la fecha de nacimiento, escríbela también y el cálculo se vuelve exacto.</p>
        <div id="hijos"></div>
        <button type="button" id="masHijo" class="mas">+ otra carga</button>
      </div>
    </div>

    <div class="aviso" id="aviso"></div>

    <table id="tabla">
      <thead><tr><th>Plan &middot; clic para leer el script</th><th class="n">UF</th><th class="n">Mensual</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="guardado" id="guardado" hidden>
      <span id="guardadoTxt">Datos guardados</span>
      <button type="button" id="limpiar">Nuevo cliente</button>
    </div>

    <div class="total">
      <div>
        <span class="t-uf" id="tUF">—</span>
        <span class="t-clp" id="tCLP"></span>
      </div>
      <button id="copiar" type="button">Copiar</button>
    </div>
    <div class="exacto" id="exacto"></div>
  </div>

  <aside class="guion" id="guion">
    <div class="guion-cab">
      <div>
        <div class="guion-tit" id="guionTit">Script</div>
        <div class="guion-sub" id="guionSub"></div>
      </div>
      <button type="button" id="cerrarGuion" title="Ocultar el script">&times;</button>
    </div>
    <div class="guion-cuerpo" id="guionCuerpo"></div>
  </aside>

</div>
<script src="popup.js"></script>
</body>
</html>
